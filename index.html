<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullstack Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
      gap: 20px;
      margin: 0;
    }
    .calculator {
      background-color: #2c3e50;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
      width: 280px;
    }
    .display {
      width: 100%;
      height: 50px;
      background-color: #ecf0f1;
      border: none;
      border-radius: 6px;
      font-size: 24px;
      text-align: right;
      padding-right: 10px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 50px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #bdc3c7;
      transition: 0.2s;
    }
    button:hover { background-color: #95a5a6; }
    button.operator { background-color: #e67e22; color: white; }
    button.operator:hover { background-color: #d35400; }
    button.clear { background-color: #e74c3c; color: white; }
    button.clear:hover { background-color: #c0392b; }
    button.zero { grid-column: span 2; }

    .history-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      width: 250px;
    }
    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 250px;
      overflow-y: auto;
    }
    .history-item {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" class="display" id="display" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="appendCharacter('/')">&divide;</button>
      <button class="operator" onclick="appendCharacter('*')">&times;</button>
      <button class="operator" onclick="appendCharacter('-')">-</button>
      
      <button onclick="appendCharacter('7')">7</button>
      <button onclick="appendCharacter('8')">8</button>
      <button onclick="appendCharacter('9')">9</button>
      <button class="operator" onclick="appendCharacter('+')">+</button>
      
      <button onclick="appendCharacter('4')">4</button>
      <button onclick="appendCharacter('5')">5</button>
      <button onclick="appendCharacter('6')">6</button>
      <button class="operator" onclick="calculate()">=</button>
      
      <button onclick="appendCharacter('1')">1</button>
      <button onclick="appendCharacter('2')">2</button>
      <button onclick="appendCharacter('3')">3</button>
      <button onclick="appendCharacter('.')">.</button>
      
      <button class="zero" onclick="appendCharacter('0')">0</button>
    </div>
  </div>

  <div class="history-container">
    <h3>MongoDB History</h3>
    <ul class="history-list" id="historyList">Loading history...</ul>
  </div>

  <script>
    const display = document.getElementById('display');
    const historyList = document.getElementById('historyList');

    function appendCharacter(char) {
      display.value += char;
    }

    function clearDisplay() {
      display.value = '';
    }

    async function calculate() {
      const expression = display.value;
      if (!expression) return;

      try {
        // Relative path used for cloud compatibility
        const response = await fetch('/api/calculate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ expression })
        });

        const data = await response.json();
        if (data.result !== undefined) {
          display.value = data.result;
          fetchHistory();
        } else {
          display.value = 'Error';
        }
      } catch (err) {
        display.value = 'Server Offline';
      }
    }

    async function fetchHistory() {
      try {
        // Relative path used for cloud compatibility
        const response = await fetch('/api/history');
        const history = await response.json();

        historyList.innerHTML = '';
        if (history.length === 0) {
          historyList.innerHTML = '<li>No history yet</li>';
          return;
        }

        history.forEach(item => {
          const li = document.createElement('li');
          li.className = 'history-item';
          li.textContent = `${item.expression} = ${item.result}`;
          historyList.appendChild(li);
        });
      } catch (err) {
        historyList.innerHTML = '<li style="color:red;">Error loading history</li>';
      }
    }

    // Load history when page opens
    fetchHistory();
  </script>
</body>
</html>
