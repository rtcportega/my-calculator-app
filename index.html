<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullstack Calculator with History</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
      margin: 0;
      background-color: #eef2f5;
    }
    .calculator {
      background-color: #2c3e50;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      width: 280px;
    }
    #display {
      width: 100%;
      height: 50px;
      background-color: #ecf0f1;
      color: #2c3e50;
      font-size: 1.8rem;
      text-align: right;
      padding: 5px 10px;
      box-sizing: border-box;
      border: none;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      padding: 15px;
      font-size: 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #bdc3c7;
      transition: background 0.2s;
    }
    button:hover { background-color: #95a5a6; }
    button.operator { background-color: #e67e22; color: white; }
    button.operator:hover { background-color: #d35400; }
    button.clear { background-color: #e74c3c; color: white; }
    button.clear:hover { background-color: #c0392b; }
    .zero { grid-column: span 2; }

    /* Dagdag Styling para sa History Container sa kilid */
    .history-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 250px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .history-box h3 { margin-top: 0; color: #2c3e50; }
    .history-list { list-style: none; padding: 0; margin: 0; max-height: 280px; overflow-y: auto; }
    .history-list li { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 0.95rem; color: #333; }
  </style>
</head>
<body>

  <!-- CALCULATOR FRONTEND -->
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="appendValue('/')" class="operator">÷</button>
      <button onclick="appendValue('*')" class="operator">×</button>
      <button onclick="appendValue('-')" class="operator">-</button>
      
      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('+')" class="operator">+</button>
      
      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="sendToBackend()" class="operator">=</button>
      
      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('.')">.</button>
      
      <button onclick="appendValue('0')" class="zero">0</button>
    </div>
  </div>

  <!-- HISTORY CONTAINER (MONGODB DATA) -->
  <div class="history-box">
    <h3>MongoDB History</h3>
    <ul id="historyList" class="history-list">
      <li>Loading history...</li>
    </ul>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(val) { display.value += val; }
    function clearDisplay() { display.value = ''; }

    // 1. IPADALA ANG EXPRESSION AT I-SAVE SA DATABASE
    async function sendToBackend() {
      const currentInput = display.value;
      if (!currentInput) return;

      try {
        const response = await fetch('http://localhost:3000/api/calculate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ expression: currentInput })
        });

        const data = await response.json();

        if (response.ok) {
          display.value = data.result;
          fetchHistory(); // I-refresh ang history UI pagkahuman mag-calculate
        } else {
          display.value = 'Error';
        }
      } catch (error) {
        display.value = 'Server Offline';
      }
    }

    // 2. KUNHA ANG HISTORY DATA GALING SA MONGODB BACKEND
    async function fetchHistory() {
      try {
        const response = await fetch('http://localhost:3000/api/history');
        const history = await response.json();
        const listElement = document.getElementById('historyList');

        listElement.innerHTML = '';
        if (history.length === 0) {
          listElement.innerHTML = '<li>No history found.</li>';
          return;
        }

        history.forEach(item => {
          const li = document.createElement('li');
          li.textContent = `${item.expression} = ${item.result}`;
          listElement.appendChild(li);
        });
      } catch (error) {
        console.error('Error fetching history:', error);
      }
    }

    // I-load dayon ang History gikan sa MongoDB pag-open sa page
    fetchHistory();
  </script>

</body>
</html>
